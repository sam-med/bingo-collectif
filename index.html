<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo</title>
<style>
  :root { --bg:#fdf1ea; --red:#e2523c; --red-soft:#fbd9cf; --cream:#fff8f3; --teal:#178091; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--red); font-family: Georgia, "Times New Roman", serif; }
  main { max-width:560px; margin:0 auto; padding:20px 14px 32px; }
  h1 { margin:8px 0 6px; text-align:center; font-weight:400; font-size:3.2rem; letter-spacing:.18em; padding-left:.18em; }
  p.sub { color:#111; margin:0 0 18px; text-align:center; font-size:.78rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; line-height:1.6; }
  label.name { color:var(--teal); display:block; margin:0 0 18px; font-size:.8rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; text-align:center; }
  input[type=text] { width:100%; font:inherit; color:var(--red); background:transparent; }
  label.name input { margin-top:6px; padding:8px; font-size:16px; text-align:center; border:0; border-bottom:2px solid var(--red); outline:0; text-transform:none; letter-spacing:0; }
  label.name input::placeholder { color:#e2523c99; }
  .grid { display:grid; border-top:1.5px solid var(--red); border-left:1.5px solid var(--red); }
  .cell { all:unset; box-sizing:border-box; cursor:pointer; position:relative; min-height:92px; padding:8px 5px; text-align:center; display:flex; align-items:center; justify-content:center;
          font-size:.74rem; line-height:1.3; border-right:1.5px solid var(--red); border-bottom:1.5px solid var(--red); -webkit-tap-highlight-color:transparent; }
  .cell.on { background:var(--red); color:var(--cream); }
  .cell.on::before { content:"✓"; position:absolute; top:3px; left:5px; font-size:.8rem; }
  .cell .note { display:none; position:absolute; top:2px; right:5px; font-size:.8rem; }
  .cell.has-note .note { display:block; }
  .count { margin:16px 0 14px; text-align:center; font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; }
  .send { width:100%; padding:14px; font:inherit; font-size:1rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; border:0; background:var(--teal); color:var(--cream); cursor:pointer; }
  .send:disabled { opacity:.5; }
  .msg { margin-top:14px; padding:12px; background:var(--red-soft); text-align:center; font-size:.9rem; display:none; }
  .msg.err { background:var(--red); color:var(--cream); }
  dialog { border:2px solid var(--red); background:var(--cream); color:var(--red); padding:18px; width:min(92vw,380px); font-family:inherit; }
  dialog::backdrop { background:rgba(60,20,10,.45); }
  dialog p { margin:0 0 12px; font-weight:700; }
  dialog input { padding:10px; font-size:16px; border:1.5px solid var(--red); background:#fff; outline:0; }
  .btns { display:flex; gap:10px; margin-top:14px; }
  .btns button { flex:1; padding:11px; font:inherit; font-weight:700; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; border:1.5px solid var(--red); background:transparent; color:var(--red); }
  .btns button.ok { background:var(--red); color:var(--cream); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <label class="name">Enter your name
    <input type="text" id="who" autocomplete="given-name" placeholder="e.g. Camille">
  </label>
  <div class="grid" id="grid"></div>
  <p class="count" id="count"></p>
  <button class="send" id="send">Submit my answers</button>
  <div class="msg" id="msg"></div>
</main>

<dialog id="dlg">
  <p id="dlgText"></p>
  <input type="text" id="dlgInput" maxlength="200">
  <div class="btns">
    <button type="button" id="dlgUncheck">Uncheck</button>
    <button type="button" class="ok" id="dlgOk">OK</button>
  </div>
</dialog>

<script src="config.js"></script>
<script>
(function () {
  var C = window.BINGO_CONFIG;
  var KEY = "bingo-state:" + location.pathname;
  var state = { who: "", cells: {} };
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s) state = s; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  $("title").textContent = C.title;
  document.title = C.title;
  $("subtitle").textContent = C.subtitle;
  $("dlgInput").placeholder = C.commentLabel;
  $("who").value = state.who || "";
  $("who").addEventListener("input", function (e) { state.who = e.target.value; save(); });

  var grid = $("grid");
  grid.style.gridTemplateColumns = "repeat(" + C.columns + ", 1fr)";
  var els = [];

  function paint(i) {
    var st = state.cells[i], el = els[i];
    el.classList.toggle("on", !!st.on);
    el.classList.toggle("has-note", !!(st.on && (st.comment || "").trim()));
  }
  function updateCount() {
    var n = Object.keys(state.cells).filter(function (k) { return state.cells[k].on; }).length;
    $("count").textContent = n + " / " + C.squares.length + " squares checked";
  }

  C.squares.forEach(function (label, i) {
    var st = state.cells[i] || (state.cells[i] = { on: false, comment: "" });
    var el = document.createElement("button");
    el.type = "button"; el.className = "cell";
    el.innerHTML = '<span class="txt"></span><span class="note">✎</span>';
    el.querySelector(".txt").textContent = label;
    el.addEventListener("click", function () { openCell(i); });
    els.push(el); grid.appendChild(el); paint(i);
  });
  var rem = C.squares.length % C.columns;
  if (rem) els[els.length - 1].style.gridColumn = "span " + (C.columns - rem + 1);
  updateCount();

  // Fenêtre de commentaire
  var dlg = $("dlg"), cur = -1, removed = false;
  function openCell(i) {
    cur = i; removed = false;
    var st = state.cells[i];
    if (!st.on) { st.on = true; paint(i); updateCount(); save(); }
    $("dlgText").textContent = C.squares[i];
    $("dlgInput").value = st.comment || "";
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    setTimeout(function () { $("dlgInput").focus(); }, 50);
  }
  function closeDlg() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  $("dlgOk").addEventListener("click", closeDlg);
  $("dlgUncheck").addEventListener("click", function () { removed = true; closeDlg(); });
  $("dlgInput").addEventListener("keydown", function (e) { if (e.key === "Enter") closeDlg(); });
  dlg.addEventListener("close", function () {
    if (cur < 0) return;
    var st = state.cells[cur];
    if (removed) { st.on = false; st.comment = ""; } else { st.comment = $("dlgInput").value; }
    paint(cur); updateCount(); save(); cur = -1;
  });

  function show(text, err) {
    var m = $("msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); m.style.display = "block";
  }

  $("send").addEventListener("click", function () {
    var who = (state.who || "").trim();
    if (!who) { show("Please enter your name before submitting.", true); return; }
    var answers = C.squares.map(function (label, i) {
      var st = state.cells[i] || {};
      return { index: i, square: label, checked: !!st.on, comment: (st.comment || "").trim() };
    });
    var payload = { participant: who, answers: answers };
    if (!C.endpoint) { console.log(payload); show("Test mode: no endpoint configured, nothing was sent (see the console).", false); return; }
    var b = $("send"); b.disabled = true;
    // text/plain évite la requête préliminaire CORS avec Google Apps Script
    fetch(C.endpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
      .then(function () { show("Thank you " + who + "! Your answers have been sent. You can still edit them and resubmit: the latest version counts."); })
      .catch(function () { show("Sending failed, please try again (your answers are kept on this device).", true); })
      .then(function () { b.disabled = false; });
  });
})();
</script>
</body>
</html>
